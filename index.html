<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Meow Build App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 12px;
    }

    /* Retícula principal con bordes un poco más gruesos y definidos */
    .brutalist-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      border: 2px solid #ffffff; /* Grosor aumentado */
    }

    /* Celdas individuales */
    .cell {
      border: 1px solid #ffffff; /* Grosor interno equilibrado */
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Ocupar todo el ancho */
    .full-width {
      grid-column: span 2;
    }

    /* Tipografía Brutalista */
    .header-title {
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.5px;
    }

    .subtext {
      font-size: 0.8rem;
      color: #cccccc;
      text-transform: uppercase;
      line-height: 1.3;
      letter-spacing: 0.5px;
    }

    .cell img {
      width: 100%;
      height: auto;
      margin-top: 12px;
      display: block;
    }
  </style>
</head>
<body>

  <div class="brutalist-grid">
    <!-- Encabezado con el nombre de la app -->
    <div class="cell full-width">
      <h1 class="header-title">MEOW BUILD APP 🐱 &rarr;</h1>
    </div>

    <!-- Bloques de contenido -->
    <div class="cell">
      <span class="subtext">SECCIÓN / MÓDULO 01</span>
      <img src="https://via.placeholder.com/300x200/111111/ffffff?text=MEOW" alt="Preview">
    </div>

    <div class="cell">
      <p class="subtext" style="color: #ffffff;">
        CONTENIDO O PANEL PRINCIPAL DE INTERACCIÓN.
      </p>
    </div>
  </div>

</body>
</html>
